<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Example</title>
    <link rel="stylesheet" href="./Canvas.css">
</head>
<body>
    <div class="canvas-container">
        <canvas id="gameCanvas" width="600" height="500" style="border:1px solid #000"></canvas>

        <div class="skill-icon" id="skill-icon" onclick="useSkill()">
            <img src="./image/dash.png" alt="skill">
            <div class="cooldown-overlay" id="cooldown-overlay"></div>
            <span class="cooldown-timer" id="cooldown-timer"></span>
        </div>
        <div class="skill-icon attack" id="attack-icon" onclick="useAttack()">
            <img src="./image/attack.png" alt="attack">
            <div class="cooldown-overlay" id="attack-cooldown-overlay"></div>
            <span class="cooldown-timer" id="attack-cooldown-timer"></span>
        
                <!-- 타겟 정보 UI -->
                <div class="target-info" id="target-info" style="display: none;">
                    <div class="target-name" id="target-name">Goblin</div>
                    <div class="target-hp-bar">
                        <div class="target-hp-fill" id="target-hp-fill"></div>
                    </div>
                    <div class="target-hp-text" id="target-hp-text">100/100</div>
                </div>
        </div>
    </div>



    <script src="./Canvas.js"></script>
    
</body>
</html>
