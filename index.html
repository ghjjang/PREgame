<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWorld RPG - Phaser 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100dvh; /* 모바일 브라우저 UI 높이 이슈 대응 */
            min-height: 100vh; /* 구형 브라우저 폴백 */
        }

        /* 비율 유지를 위해 Phaser Scale(FIT) 사용. 캔버스 강제 늘림 없음 */
        #game-container canvas {
            display: block;
            /* 픽셀 아트 선명도 유지 */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
    
</head>
<body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
